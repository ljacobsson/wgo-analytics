<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #gl-stage { position: absolute; inset: 0; background: #0a0a0f; }
    .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #gl-patch { position: absolute; left: 520px; top: 380px; width: 1210px; height: 180px; background: #131218; }
    .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 64px; }
    .cap {
      position: absolute; left: 96px; bottom: 96px; padding: 12px 20px 14px;
      background: rgba(10, 10, 15, 0.72); border-radius: 10px;
      font-weight: 600; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; color: rgba(236, 236, 241, 0.92); white-space: nowrap;
    }
    .cap .w { display: inline-block; }
    #gl-dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
  <div id="root" data-composition-id="goals" data-width="1920" data-height="1080">
    <div id="gl-stage">
      <div class="cam" id="gl-cam1"><img src="assets/screens/goals.jpg" alt="WGO Goals list" /></div>
      <div class="cam" id="gl-cam2">
        <img src="assets/screens/goal-funnel.jpg" alt="WGO goal funnel for Trial signup" />
        <div id="gl-patch"></div>
      </div>
      <svg class="cursor" id="gl-cursor" viewBox="0 0 22 32"><path d="M1 1 L1 25 L7 19.5 L11 29 L15 27.3 L11 18 L19 18 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div class="cap" id="gl-cap">
        <span class="w">Goals</span> <span class="w">and</span> <span class="w">funnels</span>
      </div>
      <div id="gl-dip"></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      gsap.set([".cam"], { transformOrigin: "0 0" });
      const c1 = cam(700, 200, 1.4);
      const row = { x: c1.x + 300 * c1.scale, y: c1.y + 222 * c1.scale }; // "Trial signup"
      gsap.set("#gl-cam2", { opacity: 0 });

      // blur swap in
      tl.fromTo("#gl-stage", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo("#gl-cam1", cam(700, 200, 1.25), { ...c1, duration: 1.2, ease: "power2.out" }, 0);
      // cursor comes in and opens the goal
      tl.fromTo("#gl-cursor", { x: 1300, y: 1150 }, { x: row.x - 2, y: row.y - 2, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.to("#gl-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in" }, 1.4);
      tl.to("#gl-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, 1.47);
      // match cut on the click: the funnel arrives slightly large and settles
      tl.set("#gl-cam1", { opacity: 0 }, 1.5);
      tl.set("#gl-cam2", { opacity: 1 }, 1.5);
      tl.fromTo("#gl-cam2", cam(1000, 440, 1.42), { ...cam(1000, 450, 1.3), duration: 0.7, ease: "expo.out" }, 1.5);
      tl.to("#gl-cursor", { x: 1500, y: 1150, duration: 0.5, ease: "power3.in" }, 1.6);
      // the funnel bars draw left to right
      tl.fromTo("#gl-patch", { clipPath: "inset(0 0 0 0%)" }, { clipPath: "inset(0 0 0 100%)", duration: 0.9, ease: "power2.inOut" }, 1.75);

      tl.fromTo("#gl-cap", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 1.9);
      tl.fromTo("#gl-cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 2.0);
      // dip before the hard cut to Errors
      tl.to("#gl-dip", { opacity: 0.4, duration: 0.1, ease: "none" }, 5.6);
      window.__timelines["goals"] = tl;
    })();
  </script>
</template>
