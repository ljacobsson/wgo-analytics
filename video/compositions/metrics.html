<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #mt-stage { position: absolute; inset: 0; background: #0a0a0f; }
    .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #mt-patch { position: absolute; left: 712px; top: 178px; width: 1162px; height: 318px; background: #131218; }
    .cap {
      position: absolute; left: 96px; bottom: 96px; padding: 12px 20px 14px;
      background: rgba(10, 10, 15, 0.72); border-radius: 10px;
      font-weight: 600; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; color: rgba(236, 236, 241, 0.92); white-space: nowrap;
    }
    .cap .w { display: inline-block; }
  </style>
  <div id="root" data-composition-id="metrics" data-width="1920" data-height="1080">
    <div id="mt-stage">
      <div class="cam" id="mt-cam">
        <img src="assets/screens/metrics.jpg" alt="WGO Metrics page" />
        <div id="mt-patch"></div>
      </div>
      <div class="cap" id="mt-cap">
        <span class="w">Metrics</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      gsap.set("#mt-cam", { transformOrigin: "0 0" });
      tl.fromTo("#mt-stage", { x: 1920, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo("#mt-cam", cam(1000, 330, 1.25), { ...cam(1000, 330, 1.3), duration: 3.6, ease: "power1.out" }, 0);
      // the chart draws itself
      tl.fromTo("#mt-patch", { clipPath: "inset(0 0 0 0%)" }, { clipPath: "inset(0 0 0 100%)", duration: 1.3, ease: "power2.inOut" }, 0.45);
      tl.fromTo("#mt-cap", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 0.8);
      tl.fromTo("#mt-cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 0.9);
      window.__timelines["metrics"] = tl;
    })();
  </script>
</template>
