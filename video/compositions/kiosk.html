  <script>
    (function () {
      // 2 x 20 GPIO pins
      const pins = document.getElementById("ks-pins");
      let svgPins = "";
      for (let i = 0; i < 20; i++) {
        for (let r = 0; r < 2; r++) svgPins += `<rect x="${86 + i * 25.4}" y="${16 + r * 22}" width="10" height="10" rx="1"/>`;
      }
      pins.innerHTML = svgPins;

      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      const capIn = (id, t) => {
        tl.set(id, { opacity: 1 }, t);
        tl.fromTo(id, { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, t);
        tl.fromTo(`${id} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t + 0.1);
      };
      const capOut = (id, t) => {
        tl.to(`${id} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.025, ease: "power2.in" }, t);
        tl.to(id, { opacity: 0, duration: 0.12, ease: "power2.in" }, t + 0.18);
      };
      gsap.set(["#ks-pcam", "#ks-ocam"], { transformOrigin: "0 0" });
      gsap.set("#ks-native", { scale: 0.5 });
      gsap.set("#ks-office", { y: -1080 });

      // ---- close-up of the Pi
      tl.fromTo("#ks-fade", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#ks-pcam", cam(960, 600, 1.12), { ...cam(960, 560, 1.0), duration: 3.3, ease: "power2.out" }, 0);
      // ACT LED: activity flicker (fixed pattern)
      const blinks = [0.4, 0.55, 0.9, 1.0, 1.1, 1.6, 1.75, 2.2, 2.3, 2.45, 2.9, 3.05];
      gsap.set(["#ks-act", "#ks-act2"], { opacity: 0 });
      blinks.forEach((t, i) => tl.set("#ks-act", { opacity: i % 2 === 0 ? 1 : 0 }, t));
      capIn("#ks-cap1", 0.6);
      capOut("#ks-cap1", 3.0);

      // ---- tilt up along the HDMI cable to the wall
      tl.to("#ks-close", { y: 1080, filter: "blur(14px)", duration: 0.5, ease: "power3.inOut" }, 3.3);
      tl.fromTo("#ks-office", { y: -1080, filter: "blur(14px)" }, { y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.inOut" }, 3.3);
      tl.set("#ks-ocam", cam(960, 540, 1.0), 3.3);

      // ---- push into the TV; the install runs on the Pi's console
      const tvCam = cam(960, 392, 1.85);
      tl.to("#ks-ocam", { ...tvCam, duration: 0.9, ease: "power2.inOut" }, 4.3);
      const c1 = document.getElementById("ks-c1").textContent.length;
      const c2 = document.getElementById("ks-c2").textContent.length;
      tl.fromTo("#ks-c1", { width: "0ch" }, { width: c1 + "ch", duration: c1 * 0.009, ease: `steps(${c1})` }, 4.7);
      tl.fromTo("#ks-c2", { width: "0ch" }, { width: c2 + "ch", duration: c2 * 0.009, ease: `steps(${c2})` }, 4.7 + c1 * 0.009 + 0.05);
      tl.fromTo(".ks-out", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.19 }, 5.9);
      [6.0, 6.2, 6.5, 6.6, 6.9, 7.1, 7.4, 7.6, 8.0, 8.1].forEach((t, i) => tl.set("#ks-act2", { opacity: i % 2 === 0 ? 1 : 0 }, t));
      capIn("#ks-cap2", 4.6);
      capOut("#ks-cap2", 7.4);

      // ---- reboot: black, then the kiosk takes the screen
      tl.to("#ks-black", { opacity: 1, duration: 0.08, ease: "none" }, 7.55);
      tl.set("#ks-kshot", { opacity: 1 }, 8.0);
      tl.to("#ks-black", { opacity: 0, duration: 0.25, ease: "power2.out" }, 8.05);
      tl.to("#ks-ocam", { ...cam(960, 470, 1.3), duration: 1.0, ease: "power2.inOut" }, 8.3);
      capIn("#ks-cap3", 8.7);
      capOut("#ks-cap3", 11.0);

      // ---- the screen rotates to Live; push back in
      tl.to("#ks-live", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 11.0);
      tl.to("#ks-ocam", { ...cam(960, 392, 1.62), duration: 1.0, ease: "power2.inOut" }, 11.2);
      capIn("#ks-cap4", 11.4);

      tl.to("#ks-all", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 15.3);
      window.__timelines["kiosk"] = tl;
    })();
  </script>
