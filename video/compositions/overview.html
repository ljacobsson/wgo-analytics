<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #ov-stage { position: absolute; inset: 0; background: #0a0a0f; }
    #ov-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #ov-cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .cap {
      position: absolute; left: 96px; bottom: 96px; padding: 12px 20px 14px;
      background: rgba(10, 10, 15, 0.72); border-radius: 10px;
      font-weight: 600; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; color: rgba(236, 236, 241, 0.92); white-space: nowrap;
    }
    .cap .w { display: inline-block; }
  </style>
  <div id="root" data-composition-id="overview" data-width="1920" data-height="1080">
    <div id="ov-stage">
      <div id="ov-cam"><img id="ov-img" src="assets/screens/overview.jpg" alt="WGO Overview page" /></div>
      <div class="cap" id="ov-cap">
        <span class="w">Overview</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      gsap.set("#ov-cam", { transformOrigin: "0 0" });
      // arrives out of the zoom-through: slightly large, settles
      tl.fromTo("#ov-stage", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#ov-cam", cam(960, 540, 1.3), { ...cam(960, 540, 1.0), duration: 0.8, ease: "expo.out" }, 0);
      // one push: KPI tiles and events over time
      tl.to("#ov-cam", { ...cam(830, 300, 1.45), duration: 1.0, ease: "power2.inOut" }, 1.4);

      tl.fromTo("#ov-cap", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 1.1);
      tl.fromTo("#ov-cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 1.2);

      // whip out left
      tl.to("#ov-stage", { x: -700, filter: "blur(16px)", duration: 0.3, ease: "power3.in" }, 5.05);
      window.__timelines["overview"] = tl;
    })();
  </script>
</template>
