<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #lv-stage { position: absolute; inset: 0; background: #0a0a0f; }
    #lv-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #lv-vid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    .cap {
      position: absolute; left: 96px; bottom: 96px; padding: 12px 20px 14px;
      background: rgba(10, 10, 15, 0.72); border-radius: 10px;
      font-weight: 600; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; color: rgba(236, 236, 241, 0.92); white-space: nowrap;
    }
    .cap .w { display: inline-block; }
  </style>
  <div id="root" data-composition-id="live" data-width="1920" data-height="1080">
    <div id="lv-stage">
      <div id="lv-cam">
        <video id="lv-vid" class="clip" src="assets/clips/live.mp4" muted playsinline
          data-start="0" data-duration="11" data-media-start="2.6" data-track-index="0"></video>
      </div>
      <div class="cap" id="lv-cap1">
        <span class="w">Live</span> <span class="w">watches</span>
      </div>
      <div class="cap" id="lv-cap2">
        <span class="w">Live</span> <span class="w">map</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      gsap.set("#lv-cam", { transformOrigin: "0 0" });
      gsap.set("#lv-cap2", { opacity: 0 });
      tl.fromTo("#lv-stage", { x: 1920, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
      // the watch counters
      tl.fromTo("#lv-cam", cam(960, 540, 1.0), { ...cam(700, 250, 1.4), duration: 2.0, ease: "sine.inOut" }, 1.4);
      tl.fromTo("#lv-cap1", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 1.6);
      tl.fromTo("#lv-cap1 .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 1.7);
      // down to the map and the firehose
      tl.to("#lv-cam", { ...cam(980, 650, 1.35), duration: 2.2, ease: "sine.inOut" }, 5.4);
      tl.to("#lv-cap1 .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 5.4);
      tl.set("#lv-cap1", { opacity: 0 }, 5.75);
      tl.set("#lv-cap2", { opacity: 1 }, 6.2);
      tl.fromTo("#lv-cap2", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 6.2);
      tl.fromTo("#lv-cap2 .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 6.3);
      // blur swap out
      tl.to("#lv-stage", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 10.7);
      window.__timelines["live"] = tl;
    })();
  </script>
</template>
