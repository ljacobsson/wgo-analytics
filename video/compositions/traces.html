<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Inter, sans-serif; }
    #tc-stage { position: absolute; inset: 0; background: #0a0a0f; }
    .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #tc-patch { position: absolute; left: 584px; top: 247px; width: 882px; height: 226px; background: #131218; }
    .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 64px; }
    .cap {
      position: absolute; left: 96px; bottom: 96px; padding: 12px 20px 14px;
      background: rgba(10, 10, 15, 0.72); border-radius: 10px;
      font-weight: 600; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; color: rgba(236, 236, 241, 0.92); white-space: nowrap;
    }
    .cap .w { display: inline-block; }
  </style>
  <div id="root" data-composition-id="traces" data-width="1920" data-height="1080">
    <div id="tc-stage">
      <div class="cam" id="tc-cam1"><img src="assets/screens/traces.jpg" alt="WGO Traces page" /></div>
      <div class="cam" id="tc-cam2">
        <img src="assets/screens/trace-waterfall.jpg" alt="Span waterfall of POST /api/checkout" />
        <div id="tc-patch"></div>
      </div>
      <svg class="cursor" id="tc-cursor" viewBox="0 0 22 32"><path d="M1 1 L1 25 L7 19.5 L11 29 L15 27.3 L11 18 L19 18 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div class="cap" id="tc-cap">
        <span class="w">Trace</span> <span class="w">waterfall</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (x, y, s) => {
        let tx = 960 - x * s, ty = 540 - y * s;
        tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
        ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
        return { x: tx, y: ty, scale: s };
      };
      gsap.set(".cam", { transformOrigin: "0 0" });
      gsap.set("#tc-cam2", { opacity: 0 });
      const cRow = cam(800, 520, 1.4);
      const row = { x: cRow.x + 360 * cRow.scale, y: cRow.y + 522 * cRow.scale }; // "POST /api/checkout"
      const cW = cam(1100, 340, 1.25);
      const logsBtn = { x: cW.x + 1702 * cW.scale, y: cW.y + 357 * cW.scale }; // "View logs for this trace"

      tl.fromTo("#tc-stage", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
      // services table: errors per service, p50 / p95
      tl.fromTo("#tc-cam1", cam(620, 300, 1.35), { ...cam(620, 290, 1.5), duration: 1.6, ease: "power2.out" }, 0);
      // down to the list of traces
      tl.to("#tc-cam1", { ...cRow, duration: 0.8, ease: "power2.inOut" }, 1.9);
      tl.fromTo("#tc-cursor", { x: 1100, y: 1150 }, { x: row.x - 2, y: row.y - 2, duration: 0.7, ease: "power3.out" }, 2.4);
      tl.to("#tc-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in" }, 3.2);
      tl.to("#tc-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, 3.27);
      // match cut on the click into the waterfall
      tl.set("#tc-cam1", { opacity: 0 }, 3.3);
      tl.set("#tc-cam2", { opacity: 1 }, 3.3);
      tl.fromTo("#tc-cam2", cam(1100, 340, 1.36), { ...cW, duration: 0.7, ease: "expo.out" }, 3.3);
      tl.fromTo("#tc-patch", { clipPath: "inset(0 0 0 0%)" }, { clipPath: "inset(0 0 0 100%)", duration: 1.0, ease: "power2.inOut" }, 3.4);
      tl.to("#tc-cursor", { x: logsBtn.x - 2, y: logsBtn.y - 2, duration: 0.9, ease: "power3.inOut" }, 5.4);
      tl.to("#tc-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in" }, 6.85);
      tl.to("#tc-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, 6.92);

      tl.fromTo("#tc-cap", { clipPath: "inset(0 100% 0 0 round 14px)" }, { clipPath: "inset(0 0% 0 0 round 14px)", duration: 0.35, ease: "expo.out" }, 3.55);
      tl.fromTo("#tc-cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 3.65);
      window.__timelines["traces"] = tl;
    })();
  </script>
</template>
