AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WGO (What's going on?) — product analytics + OpenTelemetry backend (Parquet on S3 + DuckDB, Aurora DSQL, API Gateway, Lambda, Cognito)

Parameters:
  DeletionProtection:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable deletion protection on the DSQL cluster (recommended for production).
  AllowSelfSignup:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Let anyone create an account from the dashboard. If false, create users in Cognito yourself.
  SchemaVersion:
    Type: String
    Default: '1'
    Description: Bump to force the schema migration to re-run.
  CustomDomain:
    Type: String
    Default: ''
    Description: Optional domain for the dashboard, SDK and ingest (e.g. wgo.example.com). Requires CertificateArn.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for CustomDomain, in us-east-1 (CloudFront requirement). scripts/deploy.sh creates one for you.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route 53 hosted zone of CustomDomain. When set, the DNS records are created automatically.
  AllowedEmailDomains:
    Type: String
    Default: ''
    Description: Optional comma-separated email domains allowed to sign up and use the dashboard (e.g. example.com,*.example.org). Empty = anyone.
  AdminEmails:
    Type: String
    Default: ''
    Description: Optional comma-separated emails that can see what the install costs and manage budgets. Empty = the owners of the first project.
  MaxRetentionDays:
    Type: Number
    Default: 400
    MinValue: 1
    MaxValue: 3650
    Description: Upper limit for the raw-data retention project owners can choose in Settings (default retention is 90 days). Raw data is stored as Parquet in the DataBucket.
  WriteBufferSeconds:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 300
    Description: How long incoming events, logs, spans and metrics are collected before they are written as one Parquet file. Longer means fewer, larger files (cheaper reads), shorter means fresher charts. The Live page and triggers are not delayed by it.
  ClusterMetricsProjectId:
    Type: String
    Default: ''
    Description: Optional project id that receives hourly Aurora DSQL metrics (wgo.dsql.storage_bytes, wgo.dsql.dpu) and a wgo.cluster event you can create triggers on.

Conditions:
  SignupDisabled: !Equals [!Ref AllowSelfSignup, 'false']
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]
  HasHostedZone: !And [!Condition HasCustomDomain, !Not [!Equals [!Ref HostedZoneId, '']]]
  HasEmailAllowlist: !Not [!Equals [!Ref AllowedEmailDomains, '']]

Rules:
  CustomDomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref CustomDomain, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: CustomDomain requires CertificateArn (an ACM certificate in us-east-1). scripts/deploy.sh creates it when the domain's hosted zone is in Route 53.

Mappings:
  CloudFront:
    Managed:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 15
    Environment:
      Variables:
        DSQL_ENDPOINT: !Sub '${DsqlCluster.Identifier}.dsql.${AWS::Region}.on.aws'
        MAX_RETENTION_DAYS: !Ref MaxRetentionDays
        STORE_URL: !Sub 's3://${DataBucket}'
        DUCKDB_EXTENSION_DIRECTORY: /opt/duckdb_extensions
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        ALLOWED_EMAIL_DOMAINS: !Ref AllowedEmailDomains
        ADMIN_EMAILS: !Ref AdminEmails
        # install-wide secrets set in the dashboard (lib/installSettings.ts, lib/fixConfig.ts) live under <stack>/
        SECRET_PREFIX: !Ref AWS::StackName
        FIX_SECRET_NAME: !Sub '${AWS::StackName}/fix-agent/anthropic-api-key'
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ---------------------------------------------------------------- storage
  DsqlCluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: !Ref DeletionProtection
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-analytics'

  # Raw events, logs, spans and metric points as Parquet: {table}/project_id=…/dt=YYYY-MM-DD/*.parquet
  # (backend/src/lib/store). Kept when the stack is deleted, like the data in it.
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          # uploaded source maps (sourcemaps/project_id=…/release=…/*.map)
          - Id: expire-sourcemaps
            Status: Enabled
            Prefix: sourcemaps/
            ExpirationInDays: 400
          # homepage screenshots (lib/sites.ts) replace themselves daily; this only catches strays
          - Id: expire-site-screenshots
            Status: Enabled
            Prefix: sites/
            ExpirationInDays: 30
          # SQL editor exports (lib/sql.ts): downloaded through a 15-minute link right after they're written
          - Id: expire-sql-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 1

  # DuckDB (bindings + httpfs) for the functions that query raw data; built by layers/duckdb/Makefile
  DuckDbLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/duckdb
      CompatibleRuntimes: [nodejs22.x]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # Browser events on their way to Parquet: the ingest function queues them, EventsWriterFunction writes
  # everything that arrived within WriteBufferSeconds as one file per project and day.
  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 600 # well above the writer's timeout plus the batching window
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  EventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  EventsWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: store.eventsHandler
      MemorySize: 1024
      Timeout: 60
      Policies:
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        # identities (lib/identities.ts): which user each anonymous browser turned out to be
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10000
            MaximumBatchingWindowInSeconds: !Ref WriteBufferSeconds
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/store.ts]

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: projectId, AttributeType: S }
      KeySchema:
        - { AttributeName: connectionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: ProjectIndex
          KeySchema:
            - { AttributeName: projectId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------- accounts
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Essentials (or Plus) is required for managed login, resource indicators and dynamic client registration (MCP)
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SignupDisabled, true, false]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      LambdaConfig:
        PreSignUp: !If [HasEmailAllowlist, !GetAtt PreSignUpFunction.Arn, !Ref AWS::NoValue]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your WGO verification code
        EmailMessage: 'Welcome to WGO! Your verification code is {####}'

  # Rejects sign-ups outside AllowedEmailDomains (only deployed when the allowlist is set)
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Condition: HasEmailAllowlist
    Properties:
      CodeUri: ./
      Handler: presignup.handler
      MemorySize: 256
      Timeout: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/presignup.ts]

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Condition: HasEmailAllowlist
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: dashboard
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }
      EnableTokenRevocation: true

  # ---------------------------------------------------------------- MCP auth (Cognito)
  # MCP clients use OAuth 2.1 against Cognito: they register themselves (dynamic client registration), the
  # user signs in on managed login, and the token is bound to the MCP URL with an RFC 8707 resource
  # indicator (it becomes the token's `aud`). Resource indicators and DCR need managed login (version 2).
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # globally unique per region; the stack id's first segment is lowercase hex. Repeated in McpFunction and
      # the outputs (Ref on this resource isn't the bare prefix).
      Domain: !Sub
        - 'wgo-${Id}'
        - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      ManagedLoginVersion: 2

  # Identifier = the MCP URL, so `resource=<MCP URL>` and the scope `<MCP URL>/read` belong together.
  # The same URL expression is repeated in McpAuth and the McpUrl output.
  McpResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Name: WGO MCP
      Identifier: !Sub
        - 'https://${Host}/mcp'
        - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
      Scopes:
        - { ScopeName: read, ScopeDescription: 'Read analytics, traces, logs and metrics of your projects' }

  McpAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: mcpauth.handler
      MemorySize: 256
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:DescribeUserPool, cognito-idp:UpdateUserPool]
              Resource: !GetAtt UserPool.Arn
            # the MCP switch admins set in the dashboard (install_settings)
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native]
        EntryPoints: [src/handlers/mcpauth.ts]

  # Cognito MCP auth: open dynamic client registration (CloudFormation has no property for it yet), on or off as
  # admins set it on the dashboard's MCP page (install_settings, so it needs the schema first).
  # CloudFormation's own updates of UserPool may reset it, so every property that changes the pool is
  # repeated here to re-apply it afterwards. Bump PoolConfigVersion when you change UserPool above.
  McpAuth:
    Type: Custom::CognitoMcpAuth
    DependsOn: [UserPoolDomain, McpResourceServer, DsqlSchema] # DCR needs a managed login domain; allowed scopes must exist
    Properties:
      ServiceToken: !GetAtt McpAuthFunction.Arn
      UserPoolId: !Ref UserPool
      AllowedScopes:
        - !Sub
          - 'https://${Host}/mcp/read'
          - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
      PoolConfigVersion: '1'
      AllowSelfSignup: !Ref AllowSelfSignup
      AllowedEmailDomains: !Ref AllowedEmailDomains

  # ---------------------------------------------------------------- HTTP API (dashboard API)
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type, content-encoding, x-wgo-key, x-wgo-device,
                       mcp-protocol-version, mcp-method, mcp-name, mcp-session-id, last-event-id]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        ExposeHeaders: [www-authenticate]
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5000
        ThrottlingRateLimit: 2000
      Auth:
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: ingest.queueHandler
      MemorySize: 512
      Environment:
        Variables:
          WS_MANAGEMENT_ENDPOINT: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/live'
          # geo headers are only trusted when CloudFront vouches for them with this value
          EDGE_SECRET: !Select [2, !Split ['/', !Ref AWS::StackId]]
          TRIGGER_FUNCTION: !Ref TriggerFunction
          EVENTS_QUEUE_URL: !Ref EventsQueue
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt EventsQueue.QueueName }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            # no batching window: the Live page and triggers should see events within a second
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/ingest.ts]

  OtlpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: otlp.queueHandler
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          TRIGGER_FUNCTION: !Ref TriggerFunction
      Policies:
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt OtlpQueue.Arn
            BatchSize: 1000
            MaximumBatchingWindowInSeconds: !Ref WriteBufferSeconds
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/otlp.ts]

  # ---------------------------------------------------------------- intake: SDK + OTLP
  # CloudFront sends each SDK batch and OTLP request to IntakeFunction (a function URL), which writes it to SQS and
  # answers right away, so senders never wait for DSQL or S3. For OTLP this matters most for Lambda senders, which
  # export before every invocation returns. IngestFunction and OtlpFunction process the messages. The write key is
  # checked there: requests with an unknown key are accepted and then dropped (logged), not rejected with 401.
  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576 # ~750 KB of request body after base64
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 90 # six times the consumer timeout
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDeadLetterQueue.Arn
        maxReceiveCount: 5

  IngestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  OtlpQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576 # ~750 KB of request body after base64
      MessageRetentionPeriod: 345600 # 4 days
      VisibilityTimeout: 660 # the consumer timeout plus the longest batching window, with room for retries
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OtlpDeadLetterQueue.Arn
        maxReceiveCount: 5

  OtlpDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MaximumMessageSize: 1048576
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # A function URL rather than API Gateway: a fraction of the cost per request. CloudFront's origin access control
  # can't sign the POST bodies browsers send, so the URL is public and the function only accepts requests carrying
  # the secret header CloudFront adds (X-WGO-Edge).
  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: intake.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref IngestQueue
          OTLP_QUEUE_URL: !Ref OtlpQueue
          EDGE_SECRET: !Select [2, !Split ['/', !Ref AWS::StackId]]
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt IngestQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OtlpQueue.QueueName }
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/intake.ts]

  # A public function URL needs lambda:InvokeFunction for calls through the URL as well (SAM adds InvokeFunctionUrl)
  IntakeFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IntakeFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: api.handler
      MemorySize: 2048
      # SQL editor queries run up to 24 s (lib/sql.ts); API Gateway gives up at 30 s
      Timeout: 29
      Layers: [!Ref DuckDbLayer]
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          DSQL_CLUSTER_ID: !GetAtt DsqlCluster.Identifier
          TRIGGER_FUNCTION: !Ref TriggerFunction
          FIX_AGENT_FUNCTION: !Sub '${AWS::StackName}-FixAgentFunction-run'
          MCP_AUTH_FUNCTION: !Ref McpAuthFunction
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        # "Run now" on an uptime check records its result like the scheduled run does
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
            # "Fix with agent" (named, so the API doesn't depend on the function)
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-FixAgentFunction-run'
            # secrets admins save in the dashboard: the GitHub Agent's Claude API key, the Slack app's client secret
            - Effect: Allow
              Action: [secretsmanager:CreateSecret, secretsmanager:PutSecretValue, secretsmanager:DeleteSecret, secretsmanager:GetSecretValue]
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/*'
            # the MCP switch: only the MCP auth function may change the Cognito user pool; the API may call it
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt McpAuthFunction.Arn
            # the Costs page: Cost Explorer and CloudWatch reads can't be scoped to a resource
            - Effect: Allow
              Action: [ce:GetCostAndUsage, cloudwatch:GetMetricData, cloudwatch:ListMetrics]
              Resource: '*'
      Events:
        # explicit methods (not ANY) so CORS preflight OPTIONS never reaches the JWT authorizer
        ApiGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: GET, Auth: { Authorizer: Cognito } }
        ApiPost:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: POST, Auth: { Authorizer: Cognito } }
        ApiPatch:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: PATCH, Auth: { Authorizer: Cognito } }
        ApiDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: DELETE, Auth: { Authorizer: Cognito } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/api.ts]

  # Trigger notifications: invoked asynchronously by ingest (Lambda retries failed deliveries twice)
  TriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: trigger.handler
      MemorySize: 256
      Timeout: 30
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 900
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/trigger.ts]

  # "Add to Slack" OAuth redirect (public: authenticated by the signed state it carries)
  SlackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: slack.handler
      MemorySize: 256
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            # the install's Slack app (an admin enters it on the Triggers page)
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/slack-client-secret-*'
      Events:
        Callback:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /slack/callback, Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/slack.ts]

  # Android widget: read-only, authenticated in the function with a device token (no Cognito authorizer)
  WidgetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: widget.handler
      MemorySize: 2048
      Layers: [!Ref DuckDbLayer]
      Timeout: 10
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        WidgetGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/widget/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/widget.ts]

  # Kiosk screens (wall displays): read-only, authenticated in the function with the kiosk URL's token (no Cognito)
  KioskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: kiosk.handler
      MemorySize: 2048
      Layers: [!Ref DuckDbLayer]
      Timeout: 15
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        KioskGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/kiosk/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/kiosk.ts]

  # Session recording, for the browser SDK (write-key auth, like /ingest): GET /replay/config says what to record,
  # POST /replay/start grants a session a recording slot within the project's limits (src/lib/recordings.ts).
  ReplayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: replay.handler
      MemorySize: 512
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        ReplayConfig:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /replay/config, Method: GET }
        ReplayStart:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /replay/start, Method: POST }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/replay.ts]

  # Source map uploads from CI: POST /sourcemaps/upload-url answers with a presigned S3 PUT. Authenticated in the
  # function by the project's upload key (header x-wgo-upload-key), so no Cognito authorizer.
  SourcemapFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: sourcemaps.handler
      MemorySize: 512
      Timeout: 10
      Policies:
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        SourcemapUploadUrl:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /sourcemaps/upload-url, Method: POST }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/sourcemaps.ts]

  # MCP server (/mcp) and its OAuth discovery documents. No API Gateway authorizer: unauthenticated calls must
  # get the 401 + WWW-Authenticate challenge that starts the OAuth flow, so the function verifies tokens.
  # Its public URL comes from the request (CloudFront Function below), not from the distribution: the
  # distribution depends on this API, whose routes depend on this function.
  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: mcp.handler
      MemorySize: 2048
      Layers: [!Ref DuckDbLayer]
      Timeout: 20
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          COGNITO_DOMAIN: !Sub
            - 'wgo-${Id}.auth.${AWS::Region}.amazoncognito.com' # = UserPoolDomain
            - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
          EDGE_SECRET: !Select [2, !Split ['/', !Ref AWS::StackId]]
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            # access tokens carry no email: the user's email is looked up by username
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
            # upload_sourcemaps presigns PUTs of source maps, which run with this role's permissions
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/sourcemaps/*'
      Events:
        McpPost:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: POST }
        McpGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: GET }
        McpDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp, Method: DELETE }
        McpRegister: # dynamic client registration, forwarded to Cognito (lib/mcp/http.ts registerClient)
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /mcp/register, Method: POST }
        WellKnown:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/.well-known/{proxy+}', Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/mcp.ts]

  # ---------------------------------------------------------------- WebSocket API (live updates)
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-live'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: ws.handler
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/ws.ts]

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFunction.Arn}/invocations'

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      Target: !Sub 'integrations/${WsIntegration}'

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WsIntegration}'

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $default
      Target: !Sub 'integrations/${WsIntegration}'

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsDefaultRoute]
    Properties:
      ApiId: !Ref WsApi
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 100

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  # Threshold and anomaly triggers (lib/monitor.ts), every minute. With none enabled a run is one small DSQL query.
  MonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: monitor.handler
      MemorySize: 1024
      Timeout: 55
      ReservedConcurrentExecutions: 1
      Layers: [!Ref DuckDbLayer]
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          WRITE_BUFFER_SECONDS: !Ref WriteBufferSeconds
          FIX_AGENT_FUNCTION: !Sub '${AWS::StackName}-FixAgentFunction-run'
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            # automatic GitHub Agent runs (lib/fixes.ts autoSweep)
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-FixAgentFunction-run'
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            RetryPolicy: { MaximumRetryAttempts: 0 }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/monitor.ts]

  # ---------------------------------------------------------------- GitHub Agent (admins turn it on in the dashboard)
  # One run per invocation (lib/fixAgent/agent.ts): downloads the repository into /tmp, runs a Strands agent on
  # Bedrock and opens a draft pull request through the GitHub App. It stops itself after 13.5 minutes. Never
  # retried; a run that can't start within 5 minutes is dropped and shows as failed. Named (stack names up to 42
  # characters) so the API and monitor don't depend on it (no cycle through the CloudFront distribution); the name keeps the
  # `${stack}-${LogicalId}-…` shape the Costs page (lib/costSplit.ts) attributes by.
  FixAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-FixAgentFunction-run'
      CodeUri: ./
      Handler: fixagent.handler
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 4096 }
      ReservedConcurrentExecutions: 2
      Layers: [!Ref DuckDbLayer]
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 300
      Environment:
        Variables:
          DASHBOARD_URL: !If [HasCustomDomain, !Sub 'https://${CustomDomain}', '']
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            # Claude models only (admins pick one on the GitHub Agent page). A cross-region inference profile routes to
            # the model in other regions, so the regions are wildcarded.
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*anthropic.claude-*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'
            # the Claude API key, when admins chose the Claude API instead of Bedrock
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/fix-agent/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/fixagent.ts]

  # GitHub's redirects after creating or installing the GitHub Agent's app (public: authenticated by the signed state
  # they carry). It answers 404 while the GitHub Agent is off.
  GithubFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: github.handler
      MemorySize: 256
      Timeout: 20
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        Manifest:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /github/manifest, Method: GET }
        Setup:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /github/setup, Method: GET }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/github.ts]

  # ---------------------------------------------------------------- maintenance
  # Every 15 minutes: merging small Parquet files, hourly rollups, hourly cluster metrics, daily retention (and,
  # once, moving raw rows that older versions kept in DSQL). Each run stops after 12 minutes and resumes next
  # time; no retries, so runs never overlap (no reserved concurrency needed).
  MaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: maintenance.handler
      MemorySize: 3008
      # merges spill sorted rows that don't fit DuckDB's memory to /tmp (store/maintain.ts); the default 512 MB filled up
      EphemeralStorage: { Size: 2048 }
      Layers: [!Ref DuckDbLayer]
      Timeout: 840
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          DSQL_CLUSTER_ID: !GetAtt DsqlCluster.Identifier
          CLUSTER_METRICS_PROJECT_ID: !Ref ClusterMetricsProjectId
          TRIGGER_FUNCTION: !Ref TriggerFunction
          STACK_NAME: !Ref AWS::StackName
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
            # CloudWatch metric reads can't be scoped to a resource
            - Effect: Allow
              Action: [cloudwatch:GetMetricData, cloudwatch:ListMetrics]
              Resource: '*'
            # cost budgets (lib/budgets.ts); Cost Explorer can't be scoped to a resource either
            - Effect: Allow
              Action: ce:GetCostAndUsage
              Resource: '*'
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            RetryPolicy: { MaximumRetryAttempts: 0 }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/maintenance.ts]

  # Uptime checks: fetches the checks that are due, every minute, one run at a time (no retries, so runs never overlap)
  UptimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: uptime.handler
      MemorySize: 256
      Timeout: 70
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          TRIGGER_FUNCTION: !Ref TriggerFunction
      Policies:
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TriggerFunction.Arn
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            RetryPolicy: { MaximumRetryAttempts: 0 }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/uptime.ts]

  # Headless Chromium + puppeteer-core for ScreenshotFunction; built by layers/chromium/Makefile
  ChromiumLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/chromium
      CompatibleRuntimes: [nodejs22.x]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # Homepage screenshots for the dashboard's All projects page (lib/sites.ts): every 15 minutes, it screenshots the
  # projects whose public site (found by the maintenance job) wasn't shot today, so each one at most once a day.
  # With nothing due a run is one query and never starts the browser.
  # One run at a time, no retries.
  ScreenshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: screenshot.handler
      MemorySize: 2048
      Timeout: 300
      EphemeralStorage: { Size: 1024 }
      ReservedConcurrentExecutions: 1
      Layers: [!Ref ChromiumLayer]
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub '${DataBucket.Arn}/sites/*'
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            RetryPolicy: { MaximumRetryAttempts: 0 }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api', '@sparticuz/chromium', puppeteer-core]
        EntryPoints: [src/handlers/screenshot.ts]

  # ---------------------------------------------------------------- schema migration
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: migrate.handler
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt DsqlCluster.ResourceArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        External: [pg-native, '@duckdb/node-api']
        EntryPoints: [src/handlers/migrate.ts]

  DsqlSchema:
    Type: Custom::DsqlSchema
    Properties:
      ServiceToken: !GetAtt MigrateFunction.Arn
      SchemaVersion: !Ref SchemaVersion
      SchemaHash: '2026-11-26-4' # bump when src/lib/schema.ts changes

  # ---------------------------------------------------------------- dashboard + SDK hosting
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-web'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Ingest + OTLP go through CloudFront too: edge TLS close to users, and free IP geolocation headers.
  IngestOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-ingest'
        Comment: Forward geolocation + the headers ingest and CORS preflights need (max 10)
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Country-Region-Name
            - CloudFront-Viewer-City
            - CloudFront-Viewer-Latitude
            - CloudFront-Viewer-Longitude
            - Content-Type
            - X-WGO-Key
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers

  # Every page view asks GET /replay/config whether to record: answered from the edge for a minute per write key.
  # Origin is part of the key so each site gets a response with its own CORS header.
  ReplayConfigCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-replay-config'
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: whitelist, QueryStrings: [k] }
          HeadersConfig: { HeaderBehavior: whitelist, Headers: [Origin] }

  # The MCP server must know the URL clients use (its OAuth resource identifier). API Gateway only sees its own
  # host, so this copies the viewer's Host; the function trusts it only next to the edge secret header.
  ForwardHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-forward-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Copy Host to x-forwarded-host for the MCP server
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.headers['x-forwarded-host'] = { value: request.headers.host.value };
          return request;
        }

  # A Lambda function URL hands text bodies (application/json, text/*) to the function as a string, which mangles
  # gzipped JSON (OTLP exporters send it). So every intake body goes on as application/octet-stream, which arrives
  # base64-encoded byte for byte, and the sender's Content-Type moves to the wgo-ct query parameter
  # (src/handlers/intake.ts reads it from there).
  IntakeBodyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-intake-body'
      AutoPublish: true
      FunctionConfig:
        Comment: Send intake bodies as binary, keeping the Content-Type in a query parameter
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var type = request.headers['content-type'];
          if (type) {
            request.querystring['wgo-ct'] = { value: encodeURIComponent(type.value) };
            request.headers['content-type'] = { value: 'application/octet-stream' };
          }
          return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: WGO dashboard, SDK and ingest
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-WGO-Edge
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]
          - Id: intake
            DomainName: !Select [2, !Split ['/', !GetAtt IntakeFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders: # vouches for the geolocation headers (src/lib/geo.ts)
              - HeaderName: X-WGO-Edge
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]
        # The dashboard uses hash routing, so no SPA error-page rewrites are needed. They would also
        # turn API 403/404 responses on the ingest paths into index.html.
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Managed, CachingOptimized]
          ResponseHeadersPolicyId: !FindInMap [CloudFront, Managed, SecurityHeaders]
        CacheBehaviors:
          - PathPattern: /ingest
            TargetOriginId: intake
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt IntakeBodyFunction.FunctionMetadata.FunctionARN
          - PathPattern: /v1/*
            TargetOriginId: intake
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt IntakeBodyFunction.FunctionMetadata.FunctionARN
          - PathPattern: /replay/config
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ReplayConfigCachePolicy
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: true
          - PathPattern: /replay/start
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !Ref IngestOriginRequestPolicy
            Compress: false
          # source map uploads (CI): the upload key header must reach the function
          - PathPattern: /sourcemaps/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            Compress: false
          # MCP (/mcp and /mcp/register): needs the Authorization header, which only an all-viewer-headers policy forwards
          - PathPattern: /mcp*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFunction.FunctionMetadata.FunctionARN
          - PathPattern: /.well-known/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFront, Managed, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [CloudFront, Managed, AllViewerExceptHostHeader]
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFunction.FunctionMetadata.FunctionARN

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref CustomDomain
          Type: A
          AliasTarget: { DNSName: !GetAtt WebDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } # CloudFront's fixed zone id
        - Name: !Ref CustomDomain
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt WebDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  DashboardUrl:
    Value: !Sub
      - 'https://${Host}'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  IngestUrl:
    Description: SDK endpoint + OTLP base URL (via CloudFront, adds geolocation)
    Value: !Sub
      - 'https://${Host}'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  CloudFrontDomain:
    Description: Point a CNAME for CustomDomain here if its DNS is not in Route 53
    Value: !GetAtt WebDistribution.DomainName
  ApiUrl:
    Description: Dashboard API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OtlpDeadLetterQueueUrl:
    Description: OTLP requests that failed to store 5 times. Redrive them to OtlpQueue once fixed.
    Value: !Ref OtlpDeadLetterQueue
  IngestDeadLetterQueueUrl:
    Description: SDK batches that failed to process 5 times. Redrive them to IngestQueue once fixed.
    Value: !Ref IngestDeadLetterQueue
  EventsDeadLetterQueueUrl:
    Description: Browser event batches that failed to store 5 times. Redrive them to EventsQueue once fixed.
    Value: !Ref EventsDeadLetterQueue
  DataBucketName:
    Description: Raw data as Parquet ({table}/project_id=…/dt=…/). Query it with DuckDB or Athena if you like.
    Value: !Ref DataBucket
  SlackRedirectUrl:
    Description: OAuth redirect URL for the Slack app (the app manifest printed by scripts/deploy.sh includes it)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/slack/callback'
  WsUrl:
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/live'
  SdkUrl:
    Value: !Sub
      - 'https://${Host}/sdk/v1/wgo.js'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  McpUrl:
    Description: MCP server (Streamable HTTP, OAuth via Cognito MCP auth), e.g. `claude mcp add --transport http wgo <url>`
    Value: !Sub
      - 'https://${Host}/mcp'
      - Host: !If [HasCustomDomain, !Ref CustomDomain, !GetAtt WebDistribution.DomainName]
  CognitoDomain:
    Description: Cognito managed login (the MCP OAuth sign-in page)
    Value: !Sub
      - 'https://wgo-${Id}.auth.${AWS::Region}.amazoncognito.com'
      - Id: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  DsqlEndpoint:
    Value: !Sub '${DsqlCluster.Identifier}.dsql.${AWS::Region}.on.aws'
