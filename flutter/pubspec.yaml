name: wgo_flutter
description: Flutter SDK for WGO (What's going on?) analytics. Screen views, taps, errors and failed HTTP requests from Flutter apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  clock: ^1.1.1
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
